# General settings. Site-specific machine layout lives in config/machines.yaml
# (copy it from config/machines.example.yaml).

mode: FACTORY            # GATE or FACTORY

video:
  source: "0"            # webcam index, video file path, or rtsp:// URL
  camera: cam_floor_1    # which camera this is; must match machines.yaml and the calibration file
  process_every_n_frames: 3   # video files only; live cameras always use the newest frame

model:
  pose_weights: models/yolov8n-pose.pt
  imgsz: 416             # smaller = faster on CPU
  device: cpu
  backend: openvino      # openvino (faster on Intel CPUs) or pytorch
  tracker: bytetrack.yaml
  min_keypoint_conf: 0.5 # below this a keypoint (e.g. ankle) counts as hidden

calibration_dir: calibration   # one <camera>.json per camera, made with tools/calibrate.py

privacy:
  store_frames: false    # frames stay in memory only
  blur_faces: true
  face_detector: true    # also blur faces whose body isn't tracked (e.g. forklift drivers)
  face_detector_width: 640   # 960 finds smaller faces but costs ~2x the time (36 vs 69 ms here)
  snapshot_retention_days: 7

alerts:                  # proximity alert timings (per-machine distances are in machines.yaml)
  warn_after_s: 0.6      # inside warn_m this long -> WARN (amber)
  alert_after_s: 1.0     # inside danger_m this long -> ALERT (operator + announcement)
  critical_fraction: 0.5 # inside half of danger_m ...
  critical_after_s: 0.3  # ... this long -> ALARM straight away
  approach_speed_mps: 0.3   # moving toward the machine during ALERT -> ALARM
  ack_timeout_s: 10      # ALERT not acknowledged by the operator -> ALARM
  ignored_after_s: 20    # still in danger this long after the announcement -> ALARM
  clear_margin_m: 0.2    # anti-flicker: must move this far past the line ...
  clear_after_s: 1.0     # ... for this long before the level drops
  lost_grace_s: 3.0      # keep alerting this long after a person disappears (e.g. behind the machine)
  expected_fps: 5        # analysed frames/s on this PC; used to warn if a danger zone is too small
  event_log: logs/events.jsonl   # text only: no images, no names, no tracker numbers

gate:
  box: [0.25, 0.05, 0.75, 0.98]   # inspection area as fractions of the image: x1, y1, x2, y2
  still_seconds: 0.5
  still_tolerance: 0.05           # max foot movement while "still", as a fraction of body height

inspection:
  engine: jev_vlm        # PPE checks: jev_vlm (TypeSafe Jev, cloud) or local_ml (YOLO PPE model on this PC)
                         # compare them first with tools/compare_engines.py

local_ml:                # only used when engine is local_ml (or in tools/compare_engines.py)
  weights: models/construction-ppe-yolov8s.pt   # not committed; Hugging Face killuminati1/construction-ppe-yolov8 (Apache-2.0)
  imgsz: 640                       # the size it was trained at
  min_detection_conf: 0.25         # detections below this are ignored
  min_confidence: 0.5              # below this an answer counts as unclear (YOLO scores run lower than Jev's)
  classes:               # model class names meaning present / missing (case, '-', '_' and spaces ignored)
    hard_hat: {present: [hardhat, helmet], missing: [no-hardhat, no-helmet]}
    vest: {present: [safety vest, vest], missing: [no-safety vest, no-vest]}
    boots: {present: [boots, safety boots], missing: [no-boots]}   # many PPE datasets have no boots class

jev:
  model: jev-1.14.0      # pinned; never use jev-latest
  timeout_s: 2.0
  max_workers: 3         # parallel API calls (one per PPE item)
  min_confidence: 0.7    # below this an answer counts as unclear
  required_items: [hard_hat, vest, boots]   # safety glasses: checked locally (later milestone)
  recheck_s: 60          # FACTORY mode: re-check each person's PPE at most this often (0 = off)
